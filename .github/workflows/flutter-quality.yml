name: Flutter quality gate
on:
  pull_request:
  push:
    branches: [main, feat/typing-presence]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name vibe_mingle .
      - name: Build release APK (configuration placeholder)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-mingle-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
