name: Flutter quality gate
on:
  pull_request:
  push:
    branches: [main, feat/typing-presence]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart format lib
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name vibe_mingle .
      - name: Set Android compile SDK for WebRTC dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')
          if kts.exists():
              p = kts
              s = p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          elif groovy.exists():
              p = groovy
              s = p.read_text().replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
          else:
              raise SystemExit('Android app Gradle file not found')
          p.write_text(s)
          print(f'Configured compileSdk 36 in {p}')
          PY
      - name: Align flutter_webrtc plugin compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['HOME']) / '.pub-cache' / 'hosted'
          matches = list(root.glob('*/flutter_webrtc-*/android/build.gradle'))
          if not matches:
              raise SystemExit('flutter_webrtc Android Gradle file not found in pub cache')
          p = matches[-1]
          s = p.read_text()
          s = s.replace('compileSdkVersion 31', 'compileSdkVersion 36')
          s = s.replace('compileSdk = 31', 'compileSdk = 36')
          p.write_text(s)
          print(f'Configured plugin compile SDK 36 in {p}')
          PY
      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-mingle-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
