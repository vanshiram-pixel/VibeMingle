name: Web CI
on:
  push:
    branches: [main, feat/v4.1-flutter-foundation]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run build
