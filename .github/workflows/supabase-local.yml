name: Supabase Local DB Smoke

on:
  workflow_dispatch:
  push:
    branches: [spec/v3-integrated-master-draft]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "services/api/**"
      - "package.json"
      - "services/api/package.json"
      - ".github/workflows/supabase-local.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-local.yml"

jobs:
  local-db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Initialize local Supabase config if absent
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations on disposable database
        run: supabase db reset
      - name: Run SQL smoke assertions
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/0018_migration_smoke.sql
      - name: Run authenticated RLS integration assertions
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/0019_rls_identity_isolation.sql
      - name: Run authenticated API ownership integration
        run: |
          export API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          export ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          export SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          SUPABASE_LOCAL_INTEGRATION=1 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm test --workspace services/api
      - name: Stop local Supabase
        if: always()
        run: supabase stop
